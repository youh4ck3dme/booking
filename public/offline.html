<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c5a059">
  <title>BookFlow Pro - Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 400px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      padding: 2.5rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: rgba(197, 160, 89, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    h1 {
      color: #c5a059;
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .tips {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .tips h2 {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .tips ul {
      list-style: none;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .tips li {
      padding: 0.25rem 0;
      padding-left: 1.25rem;
      position: relative;
    }
    .tips li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #c5a059;
    }
    button {
      background: linear-gradient(135deg, #0f172a 0%, #c5a059 100%);
      color: white;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 0.75rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.3);
    }
    button:active {
      transform: translateY(0);
    }
    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }
    .status.online {
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Ste offline</h1>
    <p>Momentálne nemáte pripojenie k internetu. Niektoré funkcie BookFlow Pro nemusia byť dostupné.</p>
    
    <div class="tips">
      <h2>Čo môžete urobiť:</h2>
      <ul>
        <li>Skontrolujte svoje WiFi pripojenie</li>
        <li>Skúste sa pripojiť cez mobilné dáta</li>
        <li>Počkajte a skúste to znova</li>
      </ul>
    </div>
    
    <button onclick="location.reload()">Skúsiť znova</button>
    
    <p class="status" id="status">Čakám na pripojenie...</p>
  </div>

  <script>
    function updateStatus() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.textContent = '✅ Pripojenie obnovené! Načítavam...';
        status.className = 'status online';
        setTimeout(() => location.reload(), 1000);
      } else {
        status.textContent = 'Čakám na pripojenie...';
        status.className = 'status';
      }
    }
    
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
